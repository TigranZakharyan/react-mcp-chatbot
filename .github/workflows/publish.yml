name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      # `npm stage` needs npm >= 11.15; Node 20 ships an older npm.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build package
        run: npm run build

      # NPM_API_KEY is a stage-only token: it uploads the release to npm's staging
      # area. A maintainer then approves it (2FA) with:
      #   npm stage list react-mcp-chatbot && npm stage approve <stage-id>
      - name: Stage release on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_KEY }}
        run: npm stage publish --access public --provenance
