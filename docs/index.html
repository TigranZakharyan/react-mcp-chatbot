<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-mcp-chatbot – AI chatbot for your APIs, no backend</title>
    <meta name="description" content="Documentation for react-mcp-chatbot: add an AI chatbot that calls your existing REST APIs entirely from the browser. Providers, OpenAPI import, theming, examples and API reference." />
    <meta property="og:title" content="react-mcp-chatbot – AI chatbot for your APIs, no backend" />
    <meta property="og:description" content="Describe your REST endpoints once. The model decides when to call them, the browser makes the calls. Works with OpenAI, Anthropic, Gemini, DeepSeek, Groq, Ollama and more." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0a0c13" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // apply the saved theme before first paint (avoids a flash)
      try {
        var t = localStorage.getItem("docs-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
